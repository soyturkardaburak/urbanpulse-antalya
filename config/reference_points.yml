# Containment checks for the algorithmic study area.
# Coordinates are approximate public locations, not surveyed centroids.
# "required" points must pass. "descriptive" points are reported either way.

points:
  - id: kaleici
    name: Kaleiçi
    lon: 30.7056
    lat: 36.8841
    expect: inside
    role: required
    note: Historic centre of Antalya. A dense-service study area that misses this point is not the central urban network.

  - id: kas
    name: Kaş
    lon: 29.6384
    lat: 36.1997
    expect: outside
    role: required
    note: Provincial town on the GTFS fringe. It must not enter the central comparison area.

