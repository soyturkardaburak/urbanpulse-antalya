name: urbanpulse-antalya

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
      POSTGRES_DB: urbanpulse
    ports:
      - "5432:5432"
    volumes:
      - urbanpulse_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d urbanpulse"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@db:5432/urbanpulse
      URBANPULSE_ROOT: /app
    volumes:
      - ./data/results:/app/data/results:ro
      - ./reports:/app/reports:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  urbanpulse_postgis:
